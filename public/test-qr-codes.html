<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Animal Hunt - Test QR Codes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, sans-serif; background: #fff; margin: 0; padding: 24px; }
    h1 { text-align: center; }
    .grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
    .card { text-align: center; }
    .card img { width: 260px; height: 260px; }
    .card p { font-weight: 600; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Animal Hunt - Test QR Codes</h1>
  <p style="text-align:center">Open this page on a second device/screen and scan these with the game running on your phone.</p>
  <div class="grid">
      <div class="card">
        <img src="/qr-codes/object-c.svg" alt="Dog QR code" />
        <p>Dog (object-c)</p>
      </div>

      <div class="card">
        <img src="/qr-codes/notebook.svg" alt="Cat QR code" />
        <p>Cat (notebook)</p>
      </div>

      <div class="card">
        <img src="/qr-codes/object-b.svg" alt="Pigeon QR code" />
        <p>Pigeon (object-b)</p>
      </div>

      <div class="card">
        <img src="/qr-codes/bottle.svg" alt="Rat QR code" />
        <p>Rat (bottle)</p>
      </div>

      <div class="card">
        <img src="/qr-codes/phone.svg" alt="Squirrel QR code" />
        <p>Squirrel (phone)</p>
      </div>

      <div class="card">
        <img src="/qr-codes/object-a.svg" alt="Cockroach QR code" />
        <p>Cockroach (object-a)</p>
      </div>
  </div>
</body>
</html>
